<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body style="margin:0;background:#111;color:white;text-align:center;font-family:Arial">

<h2>Scanner</h2>

<video id="video" style="width:100vw;height:80vh;object-fit:cover" playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<button onclick="startCamera()" style="font-size:20px;padding:10px">Start</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanning = false;

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    scanning = true;
    scan();

  } catch (e) {
    alert("Kamera Fehler: " + e);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
}

function scan() {

  if (!scanning) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let code = jsQR(img.data, canvas.width, canvas.height);

    if (code) {

  scanning = false;
  stopCamera();

  fetch(code.data)
    .then(res => res.text())
    .then(result => {

      const parts = result.split("|");
      const status = parts[0];
      const name = parts[1] || "";

      if (status === "OK") {

        soundGood.play();

        document.body.style.background = "green";
        document.body.innerHTML = `
          <h1 style="font-size:50px;">✔ GÜLTIG</h1>
          <p style="font-size:30px;">${name}</p>
        `;

      } else {

        soundBad.play();

        document.body.style.background = "red";
        document.body.innerHTML = `
          <h1 style="font-size:50px;">✖ UNGÜLTIG</h1>
          <p style="font-size:20px;">Bereits eingelöst</p>
        `;
      }

      setTimeout(() => {

        // Kamera neu starten (WICHTIG: kein reload!)
        document.body.innerHTML = `
          <h1>🎫 QR Scanner aktiv</h1>
          <video id="video" playsinline style="width:100vw;height:80vh;object-fit:cover"></video>
          <canvas id="canvas" style="display:none"></canvas>
          <button onclick="startCamera()">Kamera starten</button>
        `;

        video = document.getElementById("video");
        canvas = document.getElementById("canvas");
        ctx = canvas.getContext("2d");

        startCamera();

      }, 2000);

    })
    .catch(err => {
      soundBad.play();
      alert("Fehler: " + err);
    });

  return;
}
  }

  requestAnimationFrame(scan);
}

</script>

</body>
</html>
