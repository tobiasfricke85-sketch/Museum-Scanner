<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

h2{
  margin:10px 0;
}

video{
  width:100vw;
  height:80vh;
  object-fit:cover;
  background:black;
}

canvas{
  display:none;
}

button{
  font-size:20px;
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:10px;
}

</style>

</head>

<body>

<h2>🎫 QR Scanner aktiv</h2>

<video id="video" playsinline></video>

<canvas id="canvas"></canvas>

<button onclick="startCamera()">
  Kamera starten
</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let scanLock = false;

async function startCamera(){

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:"environment"
        }

      });

    video.srcObject = stream;

    await video.play();

    requestAnimationFrame(scan);

  }catch(err){

    alert("Kamera Fehler: " + err);

  }
}

function scan(){

  if(video.readyState === video.HAVE_ENOUGH_DATA){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(
      video,
      0,
      0,
      canvas.width,
      canvas.height
    );

    const imageData =
      ctx.getImageData(
        0,
        0,
        canvas.width,
        canvas.height
      );

    const code = jsQR(
      imageData.data,
      canvas.width,
      canvas.height
    );

if (code && !scanLock) {

  scanLock = true;

  window.location.href = code.data;

  return;
}
    window.addEventListener("pageshow", function () {
  startCamera();
});
    }
  }

  requestAnimationFrame(scan);
}

</script>

</body>
</html>
