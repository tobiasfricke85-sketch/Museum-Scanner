<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
      overflow: hidden;
    }

    h2 {
      margin: 10px 0;
    }

    video {
      width: 100vw;
      height: 80vh;
      object-fit: cover;
      background: black;
    }

    canvas {
      display: none;
    }

    button {
      font-size: 20px;
      padding: 12px 20px;
      margin: 10px;
      border-radius: 10px;
      border: none;
    }

    .result {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      height: 100vh;
    }
  </style>
</head>

<body>

<h2>🎫 QR Scanner aktiv</h2>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<button onclick="startCamera()">Kamera starten</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanLock = false;

const soundGood = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const soundBad = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment"
      }
    });

    video.srcObject = stream;

    await video.play();

    requestAnimationFrame(scan);

  } catch (err) {

    alert("Kamera Fehler: " + err);

  }
}

function scan() {

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const code = jsQR(
      imageData.data,
      canvas.width,
      canvas.height
    );

    if (code && !scanLock) {

      scanLock = true;

      const callbackName = "scannerCallback";

      window[callbackName] = function(result) {

        const status = result.status;
        const name = result.name || "";

        if (status === "OK") {

          soundGood.play();

          document.body.style.background = "green";

          document.body.innerHTML = `
            <div class="result">
              <h1 style="font-size:60px;">✔ GÜLTIG</h1>
              <p style="font-size:35px;">${name}</p>
            </div>
          `;

        } else if (status === "USED") {

          soundBad.play();

          document.body.style.background = "red";

          document.body.innerHTML = `
            <div class="result">
              <h1 style="font-size:60px;">✖ BEREITS EINGELÖST</h1>
              <p style="font-size:30px;">${name}</p>
            </div>
          `;

        } else {

          soundBad.play();

          document.body.style.background = "darkred";

          document.body.innerHTML = `
            <div class="result">
              <h1 style="font-size:60px;">✖ UNGÜLTIG</h1>
            </div>
          `;
        }

        setTimeout(() => {

          location.reload();

        }, 2000);
      };

      const script = document.createElement("script");
const url = new URL(code.data);

url.searchParams.set("callback", callbackName);

script.src = url.toString();

      script.onerror = function() {

        alert("Script konnte nicht geladen werden");

        scanLock = false;
      };

      document.body.appendChild(script);

      return;
    }
  }

  requestAnimationFrame(scan);
}

</script>

</body>
</html>
