<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
</head>

<body style="margin:0;background:#111;color:white;text-align:center;font-family:Arial">

<h2>Scanner</h2>

<video id="video" style="width:100vw;height:80vh;object-fit:cover" playsinline></video>
<canvas id="canvas" style="display:none"></canvas>

<button onclick="startCamera()" style="font-size:20px;padding:10px">Start</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanning = false;

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    scanning = true;
    scan();

  } catch (e) {
    alert("Kamera Fehler: " + e);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
}

function scan() {

  if (!scanning) return;

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0);

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let code = jsQR(img.data, canvas.width, canvas.height);

    if (code) {

      scanning = false;
      stopCamera();

      // 🔥 WICHTIG: KEIN fetch, KEIN JS Chaos
      window.location.href = code.data;
      return;
    }
  }

  requestAnimationFrame(scan);
}

</script>

</body>
</html>
