<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>QR Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h2 {
      margin: 10px 0;
    }

    video {
      width: 100vw;
      height: 80vh;
      object-fit: cover;
      background: black;
    }

    canvas {
      display: none;
    }

    button {
      font-size: 18px;
      padding: 12px 16px;
      margin: 10px;
    }
  </style>
</head>

<body>

<h2>🎫 QR Scanner aktiv</h2>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<button onclick="startCamera()">Start</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanLock = false;

const soundGood = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");
const soundBad = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");

async function startCamera() {

  try {

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    requestAnimationFrame(scan);

  } catch (err) {
    alert("Kamera Fehler: " + err);
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
}

function scan() {

  if (video.readyState === video.HAVE_ENOUGH_DATA) {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let code = jsQR(img.data, canvas.width, canvas.height);

    if (code && !scanLock) {

      scanLock = true;
const callbackName = "scannerCallback";

window[callbackName] = function(result) {

  const status = result.status;
  const name = result.name || "";

  if (status === "OK") {

    soundGood.play();

    document.body.style.background = "green";
    document.body.innerHTML = `
      <h1 style="font-size:50px;">✔ GÜLTIG</h1>
      <p style="font-size:30px;">${name}</p>
    `;

  } else {

    soundBad.play();

    document.body.style.background = "red";
    document.body.innerHTML = `
      <h1 style="font-size:50px;">✖ UNGÜLTIG</h1>
      <p style="font-size:20px;">Bereits eingelöst</p>
    `;
  }

  setTimeout(() => {
    location.reload();
  }, 2000);
};

const script = document.createElement("script");

script.src = code.data + "&callback=" + callbackName;

document.body.appendChild(script);
    
        .catch(err => {

          alert("FEHLER: " + err);

          scanLock = false;
        });

      return;
    }
  }

  requestAnimationFrame(scan);
}

</script>

</body>
</html>
