<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

/* 🔥 großer, klickbarer Button */
button{
  font-size:32px;
  padding:25px 40px;
  margin:20px;
  border:none;
  border-radius:15px;
  background:#1e90ff;
  color:white;
  font-weight:bold;
  width:80%;
  max-width:400px;
}

/* Kamera Vollbild */
video{
  width:100vw;
  height:80vh;
  object-fit:cover;
  background:black;
}

canvas{
  display:none;
}

h2{
  margin:10px 0;
}

</style>

</head>

<body>

<h2>🎫 QR Scanner aktiv</h2>

<video id="video" playsinline></video>

<canvas id="canvas"></canvas>

<button onclick="startCamera()">
  📷 Kamera starten
</button>

<script>

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanLock = false;

/* ---------------------------
   CAMERA START
----------------------------*/
async function startCamera(){

  try {

    // falls alte Kamera läuft → stoppen
    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;

    await video.play();

    requestAnimationFrame(scan);

  } catch(err) {

    alert("Kamera Fehler: " + err);

  }
}

/* ---------------------------
   QR SCAN LOOP
----------------------------*/
function scan(){

  if(video.readyState === video.HAVE_ENOUGH_DATA){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    const imageData = ctx.getImageData(
      0,0,canvas.width,canvas.height
    );

    const code = jsQR(
      imageData.data,
      canvas.width,
      canvas.height
    );

    if(code && !scanLock){

      scanLock = true;

      // 🔥 Kamera sofort stoppen
      if(stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }

      // Redirect zu Google Script
      window.location.href = code.data;

      return;
    }
  }

  requestAnimationFrame(scan);
}

/* ---------------------------
   RESET AFTER RETURN
----------------------------*/
window.addEventListener("pageshow", function () {

  scanLock = false;

  // Kamera bewusst NICHT automatisch starten
  // (iOS blockiert sonst NotAllowedError)

});

</script>

</body>
</html>
