<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<title>QR Scanner</title>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<style>

body{
  margin:0;
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

button{
  font-size:34px;
  padding:28px 45px;
  margin:25px;
  border:none;
  border-radius:18px;
  background:#1e90ff;
  color:white;
  font-weight:bold;
  width:85%;
  max-width:420px;
}

video{
  width:100vw;
  height:75vh;
  object-fit:cover;
  background:black;
}

canvas{ display:none; }

h2{
  margin:10px 0;
}

#result{
  font-size:40px;
  margin-top:20px;
}

</style>

</head>

<body>

<h2>🎫 QR Scanner aktiv</h2>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<button onclick="startCamera()">📷 Kamera starten</button>

<div id="result"></div>

<script>

const SUPABASE_URL = "https://mvapgwlaqzjaxhrroopf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im12YXBnd2xhcXpqYXhocnJvb3BmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4OTE4NTUsImV4cCI6MjA5NTQ2Nzg1NX0.9o5sUkIwYpxx0kvyzUI60oa-vUGtf0KYtoYHXAbGbYo";

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let stream = null;
let scanLock = false;


const soundGood = new Audio("success.mp3");
const soundBad = new Audio("error.mp3");

/* ---------------- CAMERA ---------------- */
async function startCamera(){

  try {

    if(stream){
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    });

    video.srcObject = stream;
    await video.play();

    requestAnimationFrame(scan);

  } catch(err){
    alert("Kamera Fehler: " + err);
  }
}

/* ---------------- SCAN ---------------- */
function scan(){

  if(video.readyState === video.HAVE_ENOUGH_DATA){

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    const imageData = ctx.getImageData(
      0,0,canvas.width,canvas.height
    );

    const code = jsQR(
      imageData.data,
      canvas.width,
      canvas.height
    );

    if(code && !scanLock){

      scanLock = true;

      if(stream){
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }

      const token = code.data.trim().replace(/\s/g, "");

      checkTicket(token);

      return;
    }
  }

  requestAnimationFrame(scan);
}

/* ---------------- SUPABASE ---------------- */
async function checkTicket(token){

  try {

    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/tickets?token=eq.${token}`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY
        }
      }
    );

    const data = await res.json();

    if(!data || data.length === 0){
      soundBad.play();
      showResult("❌ UNGÜLTIG", "red");
      scanLock = false;
      return;
    }

    const ticket = data[0];

    if(ticket.used){
      soundBad.play();
      showResult("✖ BEREITS EINGELÖST", "red");
      scanLock = false;
      return;
    }

    await fetch(
      `${SUPABASE_URL}/rest/v1/tickets?token=eq.${token}`,
      {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json",
          apikey: SUPABASE_KEY,
          Authorization: "Bearer " + SUPABASE_KEY,
          Prefer: "return=minimal"
        },
        body: JSON.stringify({
          used: true,
          used_at: new Date().toISOString()
        })
      }
    );

    soundGood.play();

    showResult("✔ GÜLTIG", "green");

    scanLock = false;

  } catch(err){
    console.log(err);
    showResult("FEHLER", "red");
    scanLock = false;
  }
}

/* ---------------- UI ---------------- */
function showResult(text, color){

  video.style.display = "none";
  document.body.style.background = color;

  document.getElementById("result").innerHTML = `
    <div style="margin-top:100px;font-size:60px;font-weight:bold;">
      ${text}
    </div>
  `;

  setTimeout(() => {

    document.body.style.background = "#111";
    document.getElementById("result").innerHTML = "";
    video.style.display = "block";

    startCamera();

  }, 2000);
}

/* ---------------- RESET ---------------- */
window.addEventListener("pageshow", () => {
  scanLock = false;
});

</script>

</body>
</html>
